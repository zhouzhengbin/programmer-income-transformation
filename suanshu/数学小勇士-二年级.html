<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1055">
<title>数学小勇士 · 二年级</title>
<style>
﻿*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#070b1f}
body{display:flex;align-items:center;justify-content:center}

#stage{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:linear-gradient(160deg,#1b1055 0%,#2d1b69 35%,#3a1b5e 60%,#12132e 100%);
  display:flex;flex-direction:column;
}
@media(min-aspect-ratio:3/4){ #stage{max-width:calc(100vh*0.62);max-height:100vh;border-radius:0} }

/* ============ 背景层 ============ */
#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 18s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.2)}66%{transform:translate(-30px,25px) scale(.9)}}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
.float-e{position:absolute;font-size:26px;opacity:.16;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-110vh) rotate(360deg)}}

/* ============ 通用 ============ */
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:5}
.screen.on{display:flex;animation:scrIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.pad{padding:clamp(10px,2.6vmin,20px)}
.flex1{flex:1;min-height:0}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}

/* ============ 按钮 ============ */
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;
  border-radius:clamp(14px,2.4vmin,22px);padding:clamp(12px,2.2vmin,18px) clamp(20px,4vmin,34px);
  font-size:clamp(16px,2.6vmin,22px);letter-spacing:.06em;position:relative;
  transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .12s;
  background:linear-gradient(180deg,#ffc44d,#ff8800);
  box-shadow:0 6px 0 #c05e00,0 10px 22px rgba(255,130,0,.42);
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c05e00,0 4px 10px rgba(255,130,0,.4)}
.btn.g{background:linear-gradient(180deg,#7bf08d,#22c55e);box-shadow:0 6px 0 #15803d,0 10px 22px rgba(34,197,94,.42)}
.btn.g:active{box-shadow:0 1px 0 #15803d,0 4px 10px rgba(34,197,94,.4)}
.btn.b{background:linear-gradient(180deg,#6fc9ff,#2563eb);box-shadow:0 6px 0 #1d4ed8,0 10px 22px rgba(37,99,235,.42)}
.btn.b:active{box-shadow:0 1px 0 #1d4ed8,0 4px 10px rgba(37,99,235,.4)}
.btn.p{background:linear-gradient(180deg,#c9a2ff,#7c3aed);box-shadow:0 6px 0 #5b21b6,0 10px 22px rgba(124,58,237,.42)}
.btn.p:active{box-shadow:0 1px 0 #5b21b6,0 4px 10px rgba(124,58,237,.4)}
.btn.pk{background:linear-gradient(180deg,#ff9ec4,#ec4899);box-shadow:0 6px 0 #be185d,0 10px 22px rgba(236,72,153,.42)}
.btn.pk:active{box-shadow:0 1px 0 #be185d,0 4px 10px rgba(236,72,153,.4)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.full{width:100%}

/* ============ 顶栏 ============ */
.top{display:flex;align-items:center;gap:clamp(6px,1.6vmin,12px);flex-shrink:0;z-index:20}
.chip{
  background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.25);border-radius:999px;
  padding:clamp(5px,1.2vmin,9px) clamp(10px,2.4vmin,17px);color:#fff;
  font-weight:800;font-size:clamp(12px,2vmin,16px);display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(10px);white-space:nowrap;
}
.chip .v{color:#ffd93d;font-size:clamp(14px,2.4vmin,19px)}
.mini{
  border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.13);color:#fff;
  border-radius:999px;padding:clamp(5px,1.2vmin,9px) clamp(10px,2.4vmin,17px);
  font-weight:800;font-size:clamp(12px,2vmin,16px);cursor:pointer;font-family:inherit;
  backdrop-filter:blur(10px);white-space:nowrap;
}
.mini:active{transform:scale(.94)}

/* ============ 进度条 ============ */
.bar{height:clamp(9px,1.6vmin,14px);background:rgba(0,0,0,.35);border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.16);flex-shrink:0}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd93d,#ff8800,#ec4899);transition:width .55s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 14px rgba(255,180,60,.75)}

/* ============ 首页 ============ */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vmin,20px);padding:clamp(14px,3vmin,26px);text-align:center}
.owl{font-size:clamp(60px,15vmin,110px);animation:owlB 2.4s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(0,0,0,.55))}
@keyframes owlB{0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}50%{transform:translateY(-22px) rotate(4deg) scale(1.07)}}
.ttl{
  font-size:clamp(34px,9vmin,60px);font-weight:900;letter-spacing:.06em;line-height:1.1;
  background:linear-gradient(180deg,#fff 0%,#ffe066 40%,#ff9f43 68%,#ff5f9e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 rgba(0,0,0,.35)) drop-shadow(0 0 26px rgba(255,200,60,.7));
  animation:ttlB 3s ease-in-out infinite;
}
@keyframes ttlB{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.sub{font-size:clamp(11px,2.1vmin,16px);color:#b9c4ff;letter-spacing:.34em;font-weight:700}
.stat-row{display:flex;gap:clamp(8px,2vmin,16px);flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:clamp(12px,2.4vmin,18px);padding:clamp(8px,1.8vmin,13px) clamp(14px,3vmin,22px);backdrop-filter:blur(10px)}
.stat .n{font-size:clamp(19px,4vmin,30px);font-weight:900;color:#ffd93d;line-height:1.1}
.stat .l{font-size:clamp(9px,1.6vmin,12px);color:#a9b6e8;letter-spacing:.14em;margin-top:2px}

/* ============ 关卡地图 ============ */
.map{display:grid;gap:clamp(8px,1.8vmin,14px);grid-template-columns:repeat(2,1fr);padding-bottom:16px}
@media(min-width:560px){.map{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.map{grid-template-columns:repeat(4,1fr)}}
.lv{
  position:relative;border-radius:clamp(16px,2.8vmin,24px);padding:clamp(11px,2.2vmin,17px);
  cursor:pointer;overflow:hidden;border:3px solid rgba(255,255,255,.32);
  background:linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:0 7px 0 rgba(0,0,0,.3),0 12px 26px rgba(0,0,0,.38);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s;
}
.lv::after{content:'';position:absolute;top:-50%;left:-60%;width:60%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:rotate(22deg);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
.lv:active{transform:translateY(5px) scale(.975);box-shadow:0 2px 0 rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.3)}
.lv .ic{font-size:clamp(26px,5.4vmin,40px);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));position:relative;z-index:2}
.lv .nm{color:#fff;font-weight:900;font-size:clamp(13px,2.3vmin,18px);margin-top:7px;text-shadow:0 2px 6px rgba(0,0,0,.5);position:relative;z-index:2;line-height:1.25}
.lv .py{color:rgba(255,255,255,.9);font-size:clamp(8px,1.5vmin,11px);letter-spacing:.1em;margin-top:3px;font-weight:600;position:relative;z-index:2}
.lv .sts{position:absolute;top:8px;right:9px;font-size:clamp(10px,1.9vmin,14px);z-index:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.lv .bg2{position:absolute;bottom:7px;right:9px;background:rgba(0,0,0,.4);color:#fff;font-size:clamp(8px,1.5vmin,11px);padding:2px 8px;border-radius:999px;font-weight:800;z-index:3}
.lv.lock{filter:grayscale(.9) brightness(.5)}
.lv.lock:active{transform:none}
.lv.lock::after{display:none}

/* ============ 学习讲解 ============ */
.learn-hero{
  border-radius:clamp(18px,3vmin,26px);padding:clamp(14px,2.8vmin,22px);text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 10px 28px rgba(0,0,0,.42);flex-shrink:0;
}
.learn-hero .e{font-size:clamp(40px,10vmin,72px);line-height:1;animation:heroE 2.2s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
@keyframes heroE{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.14) rotate(5deg)}}
.learn-hero .t{color:#fff;font-size:clamp(19px,4vmin,30px);font-weight:900;margin-top:6px;text-shadow:0 3px 8px rgba(0,0,0,.45)}
.learn-hero .p{color:rgba(255,255,255,.9);font-size:clamp(9px,1.7vmin,13px);letter-spacing:.24em;margin-top:4px;font-weight:700}

.card{
  background:rgba(255,255,255,.98);border-radius:clamp(16px,2.8vmin,24px);
  padding:clamp(14px,2.6vmin,22px);color:#232946;
  box-shadow:0 14px 34px rgba(0,0,0,.42),inset 0 -4px 0 rgba(0,0,0,.05);
}
.step-h{display:flex;align-items:center;gap:clamp(7px,1.6vmin,12px);margin-bottom:clamp(8px,1.8vmin,14px)}
.step-n{
  flex-shrink:0;width:clamp(28px,5.4vmin,38px);height:clamp(28px,5.4vmin,38px);border-radius:50%;
  background:linear-gradient(145deg,#ffd93d,#ff8800);color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.4vmin,18px);
  box-shadow:0 4px 0 #b35f00;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)
}
@keyframes popIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.step-t{font-size:clamp(15px,2.7vmin,21px);font-weight:900;line-height:1.35;flex:1}
.step-t em{display:block;font-style:normal;font-size:clamp(9px,1.6vmin,12px);color:#8b93b0;letter-spacing:.1em;font-weight:700;margin-top:2px}
.big-idea{font-size:clamp(15px,2.7vmin,20px);line-height:1.75;color:#2b3350;font-weight:600}
.big-idea b{color:#e8590c;font-weight:900;background:linear-gradient(180deg,transparent 62%,#ffe066 62%);padding:0 2px}
.tipbox{margin-top:clamp(9px,1.8vmin,14px);background:linear-gradient(135deg,#fff8e1,#ffeab8);border-left:clamp(4px,1vmin,7px) solid #ffb020;border-radius:clamp(10px,1.8vmin,15px);padding:clamp(9px,1.8vmin,14px);font-size:clamp(12px,2.1vmin,16px);line-height:1.7;color:#6b4a00}
.tipbox b{color:#c2410c}

/* 视觉演示区 */
.demo{margin-top:clamp(10px,2vmin,16px);background:linear-gradient(160deg,#eef4ff,#dbe7ff);border-radius:clamp(12px,2.2vmin,18px);padding:clamp(10px,2vmin,16px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:60px}
.dblk{width:clamp(26px,5vmin,40px);height:clamp(26px,5vmin,40px);border-radius:clamp(6px,1.2vmin,10px);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:clamp(10px,1.9vmin,15px);box-shadow:0 4px 0 rgba(0,0,0,.22);animation:blkP .4s backwards cubic-bezier(.34,1.56,.64,1)}
@keyframes blkP{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
.dnum{font-size:clamp(20px,4.2vmin,32px);font-weight:900;color:#e8590c;margin:0 4px}
.dop{font-size:clamp(18px,3.6vmin,26px);font-weight:900;color:#7c3aed}

/* 知识卡列表 */
.klist{display:grid;gap:clamp(7px,1.5vmin,11px)}
.kitem{display:flex;gap:clamp(8px,1.7vmin,13px);align-items:flex-start;background:#f4f7ff;border-radius:clamp(10px,1.9vmin,15px);padding:clamp(9px,1.8vmin,14px);border-left:clamp(4px,0.9vmin,6px) solid #7c3aed;animation:slideIn .45s backwards cubic-bezier(.16,1,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.kitem .ke{font-size:clamp(18px,3.4vmin,26px);flex-shrink:0;line-height:1}
.kitem .kt{font-size:clamp(12px,2.1vmin,16px);line-height:1.65;color:#2b3350;font-weight:600}
.kitem .kt b{color:#e8590c;font-weight:900}

/* ============ 答题 ============ */
.qcard{background:rgba(255,255,255,.98);border-radius:clamp(16px,2.8vmin,24px);padding:clamp(14px,2.6vmin,22px);box-shadow:0 14px 34px rgba(0,0,0,.42)}
.qtop{display:flex;gap:clamp(8px,1.8vmin,14px);align-items:center;margin-bottom:clamp(10px,2vmin,16px)}
.qemo{font-size:clamp(30px,6.6vmin,50px);line-height:1;animation:qw 2.4s ease-in-out infinite;flex-shrink:0}
@keyframes qw{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.12)}}
.qtxt{font-size:clamp(16px,2.9vmin,23px);font-weight:900;line-height:1.55;color:#232946;flex:1}
.pinyin{display:block;font-size:clamp(9px,1.5vmin,12px);color:#8b93b0;letter-spacing:.08em;font-weight:700;margin-top:4px;line-height:1.5}
.opts{display:grid;gap:clamp(7px,1.5vmin,12px)}
@media(min-width:640px) and (min-height:500px){.opts{grid-template-columns:1fr 1fr}}
.opt{
  border:3px solid #dde5f5;background:linear-gradient(180deg,#fbfdff,#eef4ff);
  border-radius:clamp(13px,2.4vmin,19px);padding:clamp(12px,2.2vmin,17px);
  font-size:clamp(17px,3vmin,25px);font-weight:900;color:#232946;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:clamp(48px,8.4vmin,62px);
  transition:transform .12s,background .18s,border-color .18s,box-shadow .12s;
  box-shadow:0 5px 0 #cdd8ec;
}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #cdd8ec}
.opt.ok{background:linear-gradient(180deg,#b8f7c6,#4ade80);border-color:#16a34a;color:#0a3d1a;box-shadow:0 5px 0 #15803d;animation:popA .45s}
.opt.no{background:linear-gradient(180deg,#ffd0d0,#f87171);border-color:#dc2626;color:#6b0f0f;box-shadow:0 5px 0 #b91c1c;animation:shk .45s}
@keyframes popA{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}18%{transform:translateX(-12px)}36%{transform:translateX(12px)}54%{transform:translateX(-8px)}72%{transform:translateX(8px)}}

.fdbk{margin-top:clamp(9px,1.8vmin,14px);border-radius:clamp(11px,2vmin,16px);padding:clamp(10px,1.9vmin,15px);font-size:clamp(12px,2.1vmin,16px);line-height:1.7;font-weight:700;display:none}
.fdbk.show{display:block;animation:fdbIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes fdbIn{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
.fdbk.good{background:linear-gradient(135deg,#d4fcdc,#a7f3c0);color:#0a5c22;border-left:5px solid #16a34a}
.fdbk.bad{background:linear-gradient(135deg,#ffe0e0,#fecaca);color:#7a1010;border-left:5px solid #dc2626}

/* ============ 结算 ============ */
.fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(11px,2.4vmin,19px);text-align:center;padding:clamp(12px,2.6vmin,22px)}
.fin .bi{font-size:clamp(58px,14vmin,100px);animation:owlB 1.6s ease-in-out infinite}
.fin h2{color:#fff;font-size:clamp(24px,5.6vmin,42px);text-shadow:0 4px 0 rgba(0,0,0,.35);font-weight:900}
.stars-b{font-size:clamp(38px,9vmin,66px);letter-spacing:.1em;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
.stars-b span{display:inline-block;animation:stIn .6s backwards cubic-bezier(.34,1.56,.64,1)}
@keyframes stIn{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}

/* ============ 特效 ============ */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center;font-size:clamp(64px,17vmin,130px);font-weight:900;opacity:0}
#fx.go{animation:fxA .95s cubic-bezier(.16,1,.3,1)}
@keyframes fxA{0%{opacity:0;transform:scale(.25) rotate(-30deg)}25%{opacity:1;transform:scale(1.22) rotate(7deg)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.conf{position:absolute;top:-30px;z-index:70;pointer-events:none;animation:cfFall linear forwards}
@keyframes cfFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(800deg);opacity:.1}}

/* 语音按钮 */
#spk{
  position:absolute;top:clamp(8px,1.8vmin,14px);right:clamp(8px,1.8vmin,14px);z-index:80;
  width:clamp(36px,6.4vmin,48px);height:clamp(36px,6.4vmin,48px);border-radius:50%;
  border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);
  font-size:clamp(16px,2.9vmin,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);color:#fff;
}
#spk:active{transform:scale(.9)}
#spk.off{opacity:.42}

</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <button id="spk">🔊</button>
  <div id="app"></div>
  <div id="fx"></div>
</div>
<script>
﻿/* ========== 语音引擎（在线 TTS） ========== */
var Voice=(function(){
  var on=true,zh=null;
  function pick(){ if(!('speechSynthesis' in window))return;
    var vs=speechSynthesis.getVoices()||[];
    zh=vs.filter(function(v){return /zh[-_]?CN|Chinese|中文|普通话|Huihui|Yaoyao|Xiaoxiao|Kangkang|Tingting/i.test(v.lang+v.name)})[0]
      || vs.filter(function(v){return /^zh/i.test(v.lang)})[0] || null; }
  if('speechSynthesis' in window){ pick(); speechSynthesis.onvoiceschanged=pick; setTimeout(pick,300); setTimeout(pick,1000); }
  return {
    say:function(t,o){ if(!on||!t)return; o=o||{};
      try{ speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(String(t)); u.lang='zh-CN';
        if(zh)u.voice=zh; u.rate=o.rate||0.86; u.pitch=o.pitch||1.18; u.volume=1;
        speechSynthesis.speak(u); }catch(e){} },
    stop:function(){ try{speechSynthesis.cancel()}catch(e){} },
    toggle:function(){ on=!on; if(!on)this.stop(); return on; },
    isOn:function(){ return on; }
  };
})();

/* ========== 音效引擎（WebAudio 合成） ========== */
var SFX=(function(){
  var c=null,on=true;
  function ac(){ if(!c){ var C=window.AudioContext||window.webkitAudioContext; if(!C)return null; c=new C(); }
    if(c.state==='suspended'){try{c.resume()}catch(e){}} return c; }
  function tn(f,d,t,v,dl){ if(!on)return; var a=ac(); if(!a)return;
    var t0=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
    o.type=t||'sine'; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v||.16,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+.03); }
  function nz(d,v){ if(!on)return; var a=ac(); if(!a)return;

﻿/* ================= 存档 ================= */

var app=document.getElementById('app'),stage=document.getElementById('stage');

function renderPy(text){
  var ks=Object.keys(PY).sort(function(a,b){return b.length-a.length});
  var h='',i=0;
  while(i<text.length){
    var hit=null;
    for(var k=0;k<ks.length;k++){ if(text.substr(i,ks[k].length)===ks[k]){hit=ks[k];break} }
    if(hit){h+='<ruby>'+hit+'<rt>'+PY[hit]+'</rt></ruby>';i+=hit.length}
    else{h+=text[i];i++}
  }
  return h;
}

/* ================= 通用 ================= */
function scr(html){ app.innerHTML=html; }
function topbar(left,center,right){
  return '<div class="top">'+left+(center||'<div class="flex1"></div>')+(right||'')+'</div>';
}
function starBar(cur,total,label){
  return '<div class="bar" style="margin:clamp(6px,1.4vmin,10px) 0"><i id="pbar" style="width:'+(total?cur/total*100:0)+'%"></i></div>';
}

/* ================= 首页 ================= */

  var allQ=0,doneQ=0,allU=UNITS.length,doneU=0;

  var h='<div class="screen on"><div class="home">';

/* ================= 关卡地图 ================= */
function map(){
  Voice.stop();
  var h='<div class="screen on pad">';
  h+=topbar('<button class="mini" id="bH">🏠 首页</button>','<div class="flex1"></div>','<div class="chip">⭐<span class="v" id="sv">'+S.stars+'</span></div>');
  var doneU=0; for(var i=0;i<UNITS.length;i++) if(S.prog[UNITS[i].id]) doneU++;
  h+=starBar(doneU,UNITS.length);
  h+='<div class="flex1 scroll" style="margin-top:clamp(8px,1.8vmin,14px)"><div class="map" id="mb"></div></div>';
  h+='</div>';
  scr(h);
  document.getElementById('bH').onclick=function(){SFX.tap();home()};
  var mb=document.getElementById('mb');
  for(var j=0;j<UNITS.length;j++){
    var u=UNITS[j], lk=S.unlock[u.id];
    var st=S.prog[u.id]||0;
    var ss='';
    for(var s=0;s<3;s++) ss+= s<st?'★':'☆';
    var d=document.createElement('div');
    d.className='lv'+(lk?'':' lock');
    d.style.setProperty('--c1',u.c1); d.style.setProperty('--c2',u.c2);
    d.style.animation='scrIn .5s backwards cubic-bezier(.16,1,.3,1)';
    d.style.animationDelay=(j*0.035)+'s';
    d.innerHTML='<div class="ic">'+u.icon+'</div><div class="nm">'+u.name+'</div><div class="py">'+u.pinyin+'</div>'
      +'<div class="sts">'+ss+'</div><div class="bg2">'+u.qs.length+'题</div>';
    (function(u,lk){ d.onclick=function(){
      SFX.init();
      if(!lk){SFX.no();Voice.say('这一关还没有解锁，先完成前面的关卡吧');return}
      SFX.tap(); startLearn(u);
    }})(u,lk);
    mb.appendChild(d);
  }
}

/* ================= 阶段一：学习讲解 ================= */
function startLearn(u){
  S.cur=u; S.learnStep=0; S.qi=0; S.ok=0; S.no=0;
  renderLearn();
}
function renderLearn(){
  Voice.stop();
  var u=S.cur, steps=u.learn, i=S.learnStep, st=steps[i], last=(i===steps.length-1);
  var h='<div class="screen on pad">';
  h+=topbar('<button class="mini" id="bB">← 返回</button>','<div class="flex1"></div>'
    ,'<div class="chip">📖 <span class="v">学习 '+(i+1)+'/'+steps.length+'</span></div>');
  h+=starBar(i+1,steps.length);
  h+='<div class="flex1 scroll" style="margin-top:clamp(8px,1.8vmin,14px);display:flex;flex-direction:column;gap:clamp(8px,1.8vmin,14px)">';
  if(i===0){
    h+='<div class="learn-hero" style="--c1:'+u.c1+';--c2:'+u.c2+'">';
    h+='<div class="e">'+u.icon+'</div><div class="t">'+u.name+'</div><div class="p">'+u.pinyin+'</div></div>';
  }
  h+='<div class="card">';
  h+='<div class="step-h"><div class="step-n">'+(i+1)+'</div><div class="step-t">'+renderPy(st.t)+'<em>'+st.py+'</em></div></div>';
  h+='<div class="big-idea">'+st.d+'</div>';
  if(st.tip) h+='<div class="tipbox">💡 <b>小提示</b><br>'+st.tip+'</div>';
  if(st.demo) h+='<div class="demo" id="demo">'+st.demo+'</div>';
  h+='</div>';
  h+='</div>';
  h+='<div style="display:flex;gap:clamp(7px,1.6vmin,12px);padding-top:clamp(8px,1.8vmin,14px)">';
  if(i>0) h+='<button class="btn b" id="bPrev" style="flex:1">← 上一步</button>';
  h+='<button class="btn '+(last?'pk':'g')+'" id="bNext" style="flex:2">'+(last?'✏️ 开始练习':'下一步 →')+'</button>';
  h+='</div></div>';
  scr(h);
  document.getElementById('bB').onclick=function(){SFX.tap();map()};
  if(i>0) document.getElementById('bPrev').onclick=function(){SFX.page();S.learnStep--;renderLearn()};
  document.getElementById('bNext').onclick=function(){SFX.init();SFX.page();
    if(last){startQuiz()}else{S.learnStep++;renderLearn()}};
  var plain=st.t.replace(/<[^>]+>/g,'');
  Voice.say(plain,{rate:.84});
}

/* ================= 阶段二：练习 ================= */
function startQuiz(){ S.qi=0; S.ok=0; S.no=0; renderQuiz(); }
function renderQuiz(){
  Voice.stop();
  var u=S.cur;
  if(S.qi>=u.qs.length) return finish();
  var q=u.qs[S.qi];
  var h='<div class="screen on pad">';
  h+=topbar('<button class="mini" id="bB">← 退出</button>','<div class="flex1"></div>'
    ,'<div class="chip">✏️ <span class="v">'+(S.qi+1)+'/'+u.qs.length+'</span></div>');
  h+=starBar(S.qi,u.qs.length);
  h+='<div class="flex1 scroll" style="margin-top:clamp(8px,1.8vmin,14px)">';
  h+='<div class="qcard">';
  h+='<div class="qtop"><div class="qemo">'+q.e+'</div><div class="qtxt">'+renderPy(q.q)+'</div></div>';
  h+='<div class="opts" id="ops"></div>';
  h+='<div class="fdbk" id="fb"></div>';
  h+='</div></div>';
  h+='<div style="padding-top:clamp(8px,1.8vmin,14px)"><button class="btn p full" id="bSpeak">🔊 再听一遍题目</button></div>';
  h+='</div>';
  scr(h);
  document.getElementById('bB').onclick=function(){SFX.tap();map()};
  document.getElementById('bSpeak').onclick=function(){SFX.tap();Voice.say(q.q,{rate:.82})};
  var ops=document.getElementById('ops');
  for(var i=0;i<q.o.length;i++){
    var b=document.createElement('button'); b.className='opt';
    b.innerHTML=String.fromCharCode(65+i)+'. '+q.o[i];
    (function(i,b){ b.onclick=function(){ pick(i,b,q,ops) } })(i,b);
    ops.appendChild(b);
  }
  Voice.say(q.q,{rate:.82});
}
function pick(idx,btn,q,ops){
  var all=ops.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++) all[i].disabled=true;
  var fb=document.getElementById('fb');
  if(idx===q.a){
    btn.classList.add('ok'); SFX.ok(); showFx('✔ 答对啦','#4ade80'); confetti(24);
    S.ok++; S.stars++; save();
    fb.className='fdbk show good';
    fb.innerHTML='🎉 <b>太棒了！</b><br>'+q.why;
    Voice.say('答对啦！'+q.why,{rate:.84});
    setTimeout(function(){S.qi++;renderQuiz()},1900);
  }else{
    btn.classList.add('no'); all[q.a].classList.add('ok');
    SFX.no(); showFx('✘ 想一想','#f87171'); S.no++;
    fb.className='fdbk show bad';
    fb.innerHTML='💡 <b>正确答案是 '+String.fromCharCode(65+q.a)+'</b><br>'+q.why;
    Voice.say('再想一想哦。'+q.why,{rate:.82});
    setTimeout(function(){S.qi++;renderQuiz()},2700);
  }
}

/* ================= 阶段三：结算 ================= */
function finish(){
  Voice.stop();
  var u=S.cur, total=u.qs.length, rate=S.ok/total;
  var st=rate>=.9?3:(rate>=.7?2:(rate>=.5?1:0));
  if(st>(S.prog[u.id]||0)) S.prog[u.id]=st;
  S.unlock[u.id+1]=true; save();
  SFX.win(); confetti(90);
  var h='<div class="screen on"><div class="fin">';
  h+='<div class="bi">'+(st>=3?'🏆':st>=2?'🎉':'💪')+'</div>';
  h+='<h2>'+(st>=3?'完美通关！':st>=2?'闯关成功！':'继续加油！')+'</h2>';
  h+='<div class="stars-b">';
  for(var i=0;i<3;i++) h+='<span style="animation-delay:'+(i*.2)+'s">'+(i<st?'⭐':'☆')+'</span>';
  h+='</div>';
  h+='<div class="card" style="width:min(92%,430px);text-align:center">';
  h+='<div style="font-size:clamp(16px,3vmin,22px);font-weight:900;margin-bottom:6px">'+u.name+'</div>';
  h+='<div style="font-size:clamp(12px,2.2vmin,16px);color:#5a6480">答对 <b style="color:#16a34a;font-size:clamp(18px,3.6vmin,26px)">'+S.ok+'</b> / '+total+' 题</div>';
  h+='<div style="font-size:clamp(11px,2vmin,14px);color:#8b93b0;margin-top:5px">累计 ⭐ '+S.stars+' 颗</div>';
  h+='</div>';
  h+='<button class="btn g full" id="bN" style="max-width:430px">'+(u.id<UNITS.length?'下一关 →':'🏠 回到首页')+'</button>';
  h+='<button class="btn b full" id="bRe" style="max-width:430px;font-size:clamp(14px,2.4vmin,18px)">📖 再学一遍</button>';
  h+='<button class="btn p full" id="bRe2" style="max-width:430px;font-size:clamp(14px,2.4vmin,18px)">🔄 再练一次</button>';
  h+='</div></div>';
  scr(h);
  document.getElementById('bN').onclick=function(){SFX.tap();
    if(u.id<UNITS.length) startLearn(UNITS[u.id]); else home()};
  document.getElementById('bRe').onclick=function(){SFX.tap();startLearn(u)};
  document.getElementById('bRe2').onclick=function(){SFX.tap();startQuiz()};
  Voice.say('恭喜你完成'+u.name+'，答对了'+S.ok+'题，获得'+S.ok+'颗星星！',{rate:.86});
}
